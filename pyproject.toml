[project]
name = "modpkgbuild"
version = "0.1.0"
authors = [
  { name="Russell Wright Helder", email="rwh@russellhelder.net" },
]
description = "Creates a new PKGBUILD by modifying another"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Archiving :: Packaging",
    "Topic :: System :: Software Distribution",
    "Topic :: Text Processing :: Filters",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pyyaml"]

[project.urls]
Homepage = "https://github.com/rhelder/modpkgbuild"
Issues = "https://github.com/rhelder/modpkgbuild/issues"

[project.scripts]
modpkgbuild = "modpkgbuild:main"

[build-system]
requires = ["flit_core >= 3.12.0, <5"]
build-backend = "flit_core.buildapi"
